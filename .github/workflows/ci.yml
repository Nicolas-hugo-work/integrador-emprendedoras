name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # MariaDB real: el esquema usa VECTOR, FULLTEXT, una vista y triggers que
  # SQLite no reproduce, así que las pruebas de integración no se sustituyen.
  MARIADB_IMAGE: mariadb:11.8

jobs:
  backend:
    name: Backend (pytest + ruff + MariaDB 11.8)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: kawsay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      CI: "true"
      APP_ENV: development
      JWT_SECRET: clave-de-integracion-continua-con-mas-de-32-caracteres
      CONTENT_ENCRYPTION_KEY: clave-de-cifrado-de-integracion-continua-32
      TEST_DATABASE_URL: mysql+pymysql://root:ci_root_password@127.0.0.1:3306/kawsay_test?charset=utf8mb4
      TEST_MIGRATION_DATABASE_URL: mysql+pymysql://root:ci_root_password@127.0.0.1:3306/kawsay_migration?charset=utf8mb4

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Preparar la base del ciclo de migración
        run: |
          mariadb -h 127.0.0.1 -u root -pci_root_password \
            -e "CREATE DATABASE IF NOT EXISTS kawsay_migration
                CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Análisis estático
        run: ruff check app tests

      - name: Pruebas
        # TEST_DATABASE_URL y TEST_MIGRATION_DATABASE_URL están definidas, así
        # que la integración con MariaDB se ejecuta en lugar de saltarse.
        run: pytest -q

      - name: Verificar que ninguna prueba de MariaDB quedó omitida
        run: |
          pytest -q --collect-only tests/test_mariadb_integration.py > /dev/null
          pytest tests/test_mariadb_integration.py tests/test_contracts.py -q -rs \
            | tee resultado.txt
          if grep -q "skipped" resultado.txt; then
            echo "::error::Hay pruebas de integración omitidas; revise las variables de entorno"
            exit 1
          fi

  frontend:
    name: Frontend (oxlint + tsc + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático y tipos
        run: npm run lint

      - name: Pruebas
        run: npm run test

      - name: Compilación
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker:
    name: Docker Compose desde cero
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir y levantar los servicios
        run: docker compose up -d --build

      - name: Esperar al backend y probar /health
        run: |
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo "backend disponible"
              exit 0
            fi
            sleep 5
          done
          echo "::error::El backend no respondió en /health"
          docker compose logs --no-color
          exit 1

      - name: Apagar
        if: always()
        run: docker compose down -v
