[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa-autonomia-backend"
version = "0.6.0"
description = "Base de datos y contratos FastAPI para la PWA de autonomía económica femenina"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
  "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
# `0001_initial_schema.py` es la linea base: se aplico tal cual en todas las
# bases y no debe reformatearse. Las migraciones nuevas si se lintean.
extend-exclude = ["alembic/versions/0001_initial_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
